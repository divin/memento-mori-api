[project]
name = "memento-mori-api"
version = "1.0.0"
description = "FastAPI service that computes life statistics (weeks left and percentage lived) for a given birthday and life expectancy."
readme = "README.md"
authors = [
    { name = "divin", email = "71128266+divin@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.5",
]

[project.scripts]
memento-mori-api = "memento_mori_api:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "ty>=0.0.84",
]
